x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    PYTHONPATH: /opt/airflow
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-oltp:
      condition: service_healthy
    minio:
      condition: service_started

services:
  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_POSTGRES_USER:-airflow}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  postgres-oltp:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${OLTP_POSTGRES_USER:-fintech_user}
      POSTGRES_PASSWORD: ${OLTP_POSTGRES_PASSWORD:-fintech_pass}
      POSTGRES_DB: ${OLTP_POSTGRES_DB:-fintech_oltp}
    ports:
      - "5433:5432"
    volumes:
      - oltp-pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${OLTP_POSTGRES_USER:-fintech_user}", "-d", "${OLTP_POSTGRES_DB:-fintech_oltp}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/data/warehouse /opt/airflow/data/lakehouse /opt/airflow/logs
        python - <<'PYEOF'
        import time
        import requests
        from src.storage import LakehouseStorage

        for _ in range(20):
            try:
                if requests.get("http://minio:9000/minio/health/live", timeout=2).status_code == 200:
                    break
            except Exception:
                pass
            time.sleep(1)

        LakehouseStorage().ensure_bucket_exists()
        PYEOF
        airflow db migrate
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --firstname Emiliano \
          --lastname Lopez \
          --role Admin \
          --email emilog2811@gmail.com \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-pg-data:
  oltp-pg-data:
  minio-data:
