financial_lakehouse:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse/financial_lakehouse.duckdb') }}"
      threads: 4
      extensions:
        - parquet
    docker_s3:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/data/warehouse/financial_lakehouse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "minio:9000"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY', 'minioadmin123') }}"
        s3_use_ssl: false
        s3_url_style: "path"
