name: Data Engineering CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-and-dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run unit, contract, and local E2E tests
        run: pytest

      - name: Execute local Bronze ingestion and full dbt Medallion + Test suite
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DBT_LAKEHOUSE_ROOT: ${{ github.workspace }}/data/lakehouse
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci_dbt.duckdb
        run: |
          python -m src.pipelines.local_runner --date 2026-11-15 --mock-api
          cd dbt
          dbt run --profiles-dir . --target local
          dbt snapshot --profiles-dir . --target local
          dbt test --profiles-dir . --target local
