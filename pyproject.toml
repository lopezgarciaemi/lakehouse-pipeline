[project]
name = "financial-lakehouse-pipeline"
version = "0.1.0"
description = "Containerized Modern Data Stack Lakehouse for multi-currency financial analytics (Airflow, MinIO S3, DuckDB, dbt)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]
